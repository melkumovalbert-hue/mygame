name: Build APK

# Запуск при сохранении в ветку main или вручную
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Настройка Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка системных библиотек
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libltdl-dev libffi-dev libssl-dev python3-dev zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake

      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Установка Buildozer и Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Сборка APK файла (это займет 10-15 минут)
        run: buildozer android debug

      - name: Загрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: SpaceDodger-APK
          path: bin/*.apk
