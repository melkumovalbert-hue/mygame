name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            openjdk-17-jdk

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3.4"
          python -m pip install buildozer

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

      - name: Build APK
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "1"
        run: |
          yes | buildozer -v android debug

      - name: Show generated APKs
        if: success()
        run: |
          echo "===== APK FILES ====="
          ls -lah bin/
          echo "===================="

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kosmicheskiy-uvorotchik-apk
          path: bin/*.apk
          if-no-files-found: error
:::

### 2. `buildozer.spec`

Полностью замени содержимое на:

:::writing{variant="standard" id="74106" title="buildozer.spec"}
```ini
[app]

title = Космический уворотчик
package.name = spacedodger
package.domain = org.albert

source.dir = .
source.include_exts = py,png,jpg,jpeg,wav,mp3,ogg,ttf

version = 1.0

requirements = python3==3.10.12,hostpython3==3.10.12,pygame

orientation = portrait
fullscreen = 1

android.api = 33
android.minapi = 21
android.ndk = 25b
android.ndk_api = 21

android.archs = arm64-v8a

android.accept_sdk_license = True

android.permissions = VIBRATE

[buildozer]

log_level = 2
warn_on_root = 0
